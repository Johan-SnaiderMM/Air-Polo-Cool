<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Sin conexión · Polo Air Cool</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #f4f7fb; color: #0b1633; text-align: center; padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 340px; }
      img { width: 88px; height: 88px; border-radius: 50%; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 28px; margin: 16px 0 8px; }
      p { color: #4e5b70; line-height: 1.5; margin: 8px 0; font-size: 15px; }
      a, button {
        display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 24px;
        border-radius: 12px; border: 0; background: #0b1633; color: #fff; font-size: 15px; font-weight: 500;
        text-decoration: none; margin-top: 16px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <h1>Sin conexión</h1>
      <p>No hay internet y esta pantalla aún no se había abierto en este teléfono.</p>
      <p>Lo que ya visitaste sigue disponible, y los gastos, abonos, órdenes y fotos que registres se guardan y se suben solos al volver la red.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <br />
      <a href="/">Ir al inicio</a>
    </main>
  </body>
</html>
